<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonton Anime Gratis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .anime-card:hover { transform: scale(1.05); transition: 0.3s; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">

    <header class="p-5 bg-gray-800 shadow-xl text-center">
        <h1 class="text-3xl font-bold text-blue-400">StreamAnime</h1>
    </header>

    <main class="container mx-auto p-5">
        <div id="player-container" class="hidden mb-8 p-4 bg-black rounded-lg shadow-2xl">
            <div class="relative pb-[56.25%] h-0 overflow-hidden">
                <iframe id="video-iframe" 
                        src="" 
                        class="absolute top-0 left-0 w-full h-full" 
                        frameborder="0" 
                        allowfullscreen>
                </iframe>
            </div>
            <button onclick="closePlayer()" class="mt-4 px-4 py-2 bg-red-600 rounded text-sm hover:bg-red-700">Tutup Player</button>
        </div>

        <div id="anime-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
            <p class="text-center col-span-full">Memuat daftar anime...</p>
        </div>
    </main>

    <script>
        // Gunakan konstanta API_URL yang sudah kamu buat
        const API_URL = "https://script.google.com/macros/s/AKfycbxUz-D3UC7SrsGU5e9_DeeeYBrza2lmGZWclYIx7-RIdgoYBatFPErDX79M9bV4WEirGA/exec";

        async function loadAnime() {
            try {
                // Tambahkan tanda petik pada API_URL
                const response = await fetch(API_URL);
                const data = await response.json();
                const container = document.getElementById('anime-list');
                container.innerHTML = '';
                
                data.forEach(anime => {
                    const card = `
                        <div class="anime-card bg-gray-800 rounded-lg overflow-hidden shadow-lg cursor-pointer" 
                             onclick="playVideo('${anime.link_video}')">
                            <img src="${anime.thumbnail}" class="w-full h-48 object-cover">
                            <div class="p-3">
                                <h3 class="text-sm font-semibold truncate">${anime.judul}</h3>
                                <p class="text-xs text-gray-400">Eps ${anime.episode}</p>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                document.getElementById('anime-list').innerHTML = '<p class="text-center col-span-full text-red-500">Gagal memuat data. Cek Console (F12).</p>';
            }
        }

        function playVideo(link) {
            const container = document.getElementById('player-container');
            const iframe = document.getElementById('video-iframe');
            iframe.src = link;
            container.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closePlayer() {
            const container = document.getElementById('player-container');
            const iframe = document.getElementById('video-iframe');
            container.classList.add('hidden');
            iframe.src = ""; 
        }

        // PENTING: Panggil fungsi ini agar jalan saat web dibuka!
        loadAnime();
    </script>
</body>
</html>
